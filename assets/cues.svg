<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='300' viewBox='0 0 1200 300' role='img' aria-label='Three ways a cue lands: at loop end, at phrase, right away'><defs>
<marker id='ah' markerWidth='8' markerHeight='8' refX='6' refY='4' orient='auto' markerUnits='userSpaceOnUse'><path d='M0,0 L8,4 L0,8 z' fill='#b8862b'/></marker>
<pattern id='grain' width='6' height='6' patternUnits='userSpaceOnUse'><circle cx='1' cy='1' r='.6' fill='#2b1d12' opacity='.05'/><circle cx='4' cy='4' r='.5' fill='#2b1d12' opacity='.04'/></pattern>
<linearGradient id='vign' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#1a130d' stop-opacity='.10'/><stop offset='.15' stop-color='#1a130d' stop-opacity='0'/><stop offset='.85' stop-color='#1a130d' stop-opacity='0'/><stop offset='1' stop-color='#1a130d' stop-opacity='.12'/></linearGradient>
</defs><rect width='1200' height='300' rx='14' fill='#efe3c7'/><rect width='1200' height='300' rx='14' fill='url(#grain)'/><rect width='1200' height='300' rx='14' fill='url(#vign)'/><rect x='8' y='8' width='1184' height='284' rx='10' fill='none' stroke='#b8862b' stroke-width='2'/><rect x='14' y='14' width='1172' height='272' rx='7' fill='none' stroke='#b8862b' stroke-width='.8' opacity='.7'/><text x='60' y='48' font-family='JetBrains Mono,Menlo,monospace' font-size='11' fill='#b8862b' text-anchor='start' letter-spacing='1.5'>WHEN THE NEXT SECTION ARRIVES</text><rect x='60.0' y='70' width='344.0' height='170' rx='6' fill='#e6d6b3' stroke='#c9b48a' stroke-width='1.5' opacity='1'/><text x='78.0' y='106' font-family='Georgia,"Times New Roman",serif' font-size='20' font-weight='bold' font-style='normal' fill='#5f7f3b' text-anchor='start' letter-spacing='0'>at loop end</text><text x='78.0' y='132' font-family='Georgia,"Times New Roman",serif' font-size='13' font-weight='normal' font-style='normal' fill='#7a6246' text-anchor='start' letter-spacing='0'>the current pass finishes — most musical</text><line x1='78.0' y1='188' x2='386.0' y2='188' stroke='#c9b48a' stroke-width='3' stroke-linecap='round'/><circle cx='78.0' cy='188' r='4' fill='#7a6246'/><circle cx='386.0' cy='188' r='8' fill='#5f7f3b' stroke='#1a130d' stroke-width='1'/><text x='78.0' y='210' font-family='JetBrains Mono,Menlo,monospace' font-size='9.5' fill='#7a6246' text-anchor='start' letter-spacing='1.5'>NOW</text><text x='386.0' y='210' font-family='JetBrains Mono,Menlo,monospace' font-size='9.5' fill='#7a6246' text-anchor='end' letter-spacing='1.5'>LOOP END</text><rect x='428.0' y='70' width='344.0' height='170' rx='6' fill='#e6d6b3' stroke='#c9b48a' stroke-width='1.5' opacity='1'/><text x='446.0' y='106' font-family='Georgia,"Times New Roman",serif' font-size='20' font-weight='bold' font-style='normal' fill='#b8862b' text-anchor='start' letter-spacing='0'>at phrase</text><text x='446.0' y='132' font-family='Georgia,"Times New Roman",serif' font-size='13' font-weight='normal' font-style='normal' fill='#7a6246' text-anchor='start' letter-spacing='0'>next 4- or 8-bar boundary — sooner, still musical</text><line x1='446.0' y1='188' x2='754.0' y2='188' stroke='#c9b48a' stroke-width='3' stroke-linecap='round'/><circle cx='446.0' cy='188' r='4' fill='#7a6246'/><circle cx='584.6' cy='188' r='8' fill='#b8862b' stroke='#1a130d' stroke-width='1'/><text x='446.0' y='210' font-family='JetBrains Mono,Menlo,monospace' font-size='9.5' fill='#7a6246' text-anchor='start' letter-spacing='1.5'>NOW</text><text x='754.0' y='210' font-family='JetBrains Mono,Menlo,monospace' font-size='9.5' fill='#7a6246' text-anchor='end' letter-spacing='1.5'>LOOP END</text><rect x='796.0' y='70' width='344.0' height='170' rx='6' fill='#e6d6b3' stroke='#c9b48a' stroke-width='1.5' opacity='1'/><text x='814.0' y='106' font-family='Georgia,"Times New Roman",serif' font-size='20' font-weight='bold' font-style='normal' fill='#9c3b2e' text-anchor='start' letter-spacing='0'>right away</text><text x='814.0' y='132' font-family='Georgia,"Times New Roman",serif' font-size='13' font-weight='normal' font-style='normal' fill='#7a6246' text-anchor='start' letter-spacing='0'>short crossfade — for ambushes and dragons</text><line x1='814.0' y1='188' x2='1122.0' y2='188' stroke='#c9b48a' stroke-width='3' stroke-linecap='round'/><circle cx='814.0' cy='188' r='4' fill='#7a6246'/><circle cx='814.0' cy='188' r='8' fill='#9c3b2e' stroke='#1a130d' stroke-width='1'/><text x='814.0' y='210' font-family='JetBrains Mono,Menlo,monospace' font-size='9.5' fill='#7a6246' text-anchor='start' letter-spacing='1.5'>NOW</text><text x='1122.0' y='210' font-family='JetBrains Mono,Menlo,monospace' font-size='9.5' fill='#7a6246' text-anchor='end' letter-spacing='1.5'>LOOP END</text><text x='60' y='272' font-family='Georgia,"Times New Roman",serif' font-size='13' font-weight='normal' font-style='normal' fill='#7a6246' text-anchor='start' letter-spacing='0'>Applies to Next, part pads, scene pads and hotkeys alike. Build-ups are one-shots: they play once and move on by themselves.</text></svg>